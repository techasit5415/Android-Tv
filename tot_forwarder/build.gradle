plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.itv.mobile.tv'
    compileSdk 34

    defaultConfig {
        applicationId "cn.itv.mobile.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
